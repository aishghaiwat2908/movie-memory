services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: movie_memory
      POSTGRES_USER: movie_memory
      POSTGRES_PASSWORD: movie_memory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_memory -d movie_memory"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
